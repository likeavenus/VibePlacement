# Example for a dedicated Selectel VPS virtual host. Set a domain before enabling.
server {
    listen 80;
    server_name vibeplacement.example.com;
    root /var/www/vibeplacement;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:js|css|jpg|png|webp|svg|mp4|wav|woff2)$ {
        try_files $uri =404;
        expires 1d;
    }
}
